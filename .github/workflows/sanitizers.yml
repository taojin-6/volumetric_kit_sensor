name: sanitizers

# AddressSanitizer + UndefinedBehaviorSanitizer + LeakSanitizer, Linux-only
# (LeakSanitizer isn't available on macOS). Runs the Vulkan-touching tests on
# lavapipe (software Vulkan) under the sanitizers and the Khronos validation
# layer with synchronization validation — this is what catches the leak /
# use-after-free / double-free class the unit tests alone can't detect, and the
# layer reports a leaked Vulkan object, which LSan cannot see past the driver's
# suppressions. Invoked by ci.yml, which owns the push / pull_request triggers
# and the concurrency group.
#
# It runs on the owner's Linux GPU boxes in a job container of ci.yml's
# ubuntu-26.04 image, the hosts' own release, and installs what it needs
# there, as _build.yml's container legs do. No GPU is passed through: the
# loader is pinned to lavapipe, so no driver whose allocations LSan would
# report as leaks is loaded.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  asan-ubsan-lsan:
    runs-on: [self-hosted, vk-linux-gpu]
    # ubuntu:26.04, pinned by digest as ci.yml pins it. A runner's .env does
    # not reach a job container, so the build and test fan-out is set here,
    # as ci.yml sets it for its legs.
    container:
      image: ubuntu@sha256:6a06111c3b0a8600feadb270aec771dc239bf407b25625f93f44ab00e11f4d3c
      env:
        CMAKE_BUILD_PARALLEL_LEVEL: '4'
        CTEST_PARALLEL_LEVEL: '4'
    timeout-minutes: 15
    defaults:
      run:
        # A container runs `run:` steps under sh unless told otherwise.
        shell: bash
    env:
      ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
      # Mesa's and the validation layer's caches stay in the container, which
      # goes with the job: $HOME here is the runner's _temp/_github_home, where
      # root's files would outlive it.
      XDG_CACHE_HOME: /tmp
    steps:
      # The bare image lacks git, which the checkout needs, and the
      # toolchain. Ubuntu packages clang's sanitizer runtimes apart from it
      # (libclang-rt-dev), its llvm-symbolizer too (llvm), and lavapipe in
      # mesa-vulkan-drivers.
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git \
            clang libclang-rt-dev llvm cmake make libglm-dev libvulkan-dev \
            vulkan-validationlayers spirv-tools glslang-tools vulkan-tools \
            mesa-vulkan-drivers

      # The job runs as root, as the build legs do, so it checks out where
      # they do and cleans what they leave.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # lavapipe's ICD is found, not hardcoded, as its path moves between Mesa
      # versions, and the loader is pinned to it alone. The suppressions'
      # path is absolute, as ctest changes cwd per test, and is the
      # container's: ${{ github.workspace }} names the host's.
      - name: Pin the loader to lavapipe, point LSan at the suppressions
        run: |
          icd=""; for f in /usr/share/vulkan/icd.d/lvp_icd*.json; do [ -e "$f" ] && { icd="$f"; break; }; done
          if [ -z "$icd" ]; then
            echo "::error::mesa-vulkan-drivers installed no lavapipe ICD"
            exit 1
          fi
          echo "VK_ICD_FILENAMES=$icd" >> "$GITHUB_ENV"
          echo "VK_DRIVER_FILES=$icd" >> "$GITHUB_ENV"
          supp="${GITHUB_WORKSPACE}/tools/lsan.supp"
          if [ ! -r "$supp" ]; then
            echo "::error::no LSan suppressions at ${supp}"
            exit 1
          fi
          # Without it reports show bare addresses, and the suppressions that
          # name a function (leak:lvp_) match nothing.
          if ! command -v llvm-symbolizer >/dev/null; then
            echo "::error::no llvm-symbolizer on PATH"
            exit 1
          fi
          echo "LSAN_OPTIONS=suppressions=${supp}:print_suppressions=0" >> "$GITHUB_ENV"

      # lavapipe is REQUIRED here: the whole point of this job is to run the
      # Vulkan-touching code under ASan/UBSan/LSan. If no device comes up we FAIL
      # loudly — a green run that silently skipped those tests (the leak /
      # use-after-free / double-free class) is worse than a red one.
      - name: Require a Vulkan device (lavapipe)
        run: |
          echo "--- ICD ($VK_ICD_FILENAMES) ---"; cat "$VK_ICD_FILENAMES"
          echo "--- lavapipe .so deps ---"
          if ldd /usr/lib/x86_64-linux-gnu/libvulkan_lvp.so* 2>&1 | grep -i 'not found'; then
            echo "::error::lavapipe shared object has missing libraries (see above)"; exit 1
          fi
          echo "--- vulkaninfo (loader debug on) ---"
          if ! VK_LOADER_DEBUG=error,warn vulkaninfo --summary; then
            echo "::error::lavapipe produced no Vulkan device — the Vulkan-touching tests would skip under the sanitizers"
            exit 1
          fi

      # Cache the FetchContent dependency tree (sources and builds), as
      # _build.yml does, so it is not re-fetched and recompiled every run. Here
      # the dependencies are compiled with the sanitizers too (VS_SANITIZE sets
      # its flags globally), so besides the pins the key carries everything that
      # changes their objects: the compiler, the image's OS release, the
      # installed versions of the headers and the shader compiler they build
      # on, this workflow (the sanitizer and build settings below) and
      # vs_sanitizers.cmake. The checkout's path is in it as in _build.yml,
      # since FetchContent bakes it in. No restore-keys: a stale match would
      # link objects built for something else.
      - name: Dependency cache key
        id: deps
        run: |
          hash() { sha256sum | cut -c1-12; }
          ws=$(printf '%s' "${PWD}" | hash)
          cc=$(clang --version | head -1 | hash)
          os=$(. /etc/os-release && printf '%s%s' "${ID}" "${VERSION_ID}")
          pk=$(dpkg-query -W -f='${Package}=${Version}\n' \
            libvulkan-dev libglm-dev glslang-tools | hash)
          echo "key=sanitizers-deps-ws${ws}-cc${cc}-${os}-pk${pk}" >> "${GITHUB_OUTPUT}"

      - name: Cache third-party deps
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/_deps
          key: ${{ steps.deps.outputs.key }}-${{ hashFiles('third_party/CMakeLists.txt', 'CMakeLists.txt', 'cmake/vs_sanitizers.cmake', '.github/workflows/sanitizers.yml') }}

      # Debug + clang gives the most reliable sanitizer + mesa interop. The
      # drivers stay off (no Orbbec SDK, FFmpeg or CUDA in the container); the
      # Mac's ThreadSanitizer step runs the Orbbec decode workers.
      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DVS_SANITIZE="address;undefined"

      # Runs CMAKE_BUILD_PARALLEL_LEVEL jobs at once (the container env
      # above), or one per core where unset, as _build.yml's Build step does.
      - name: Build
        run: |
          cmake --build build \
            --parallel "${CMAKE_BUILD_PARALLEL_LEVEL:-$(getconf _NPROCESSORS_ONLN)}"

      # If a future mesa bump produces leak noise tools/lsan.supp doesn't cover,
      # the escape hatch is to split this run: CPU-only tests with full leak
      # detection, driver-backed tests with ASAN_OPTIONS=detect_leaks=0 (ASan +
      # UBSan still on). Prefer extending the suppressions first.
      #
      # Runs CTEST_PARALLEL_LEVEL tests at once (the container env above), or
      # one per core where unset; lavapipe sizes its thread pool to the whole
      # host, so each test takes more than a core. The slowest test starts
      # first, by the COST tests/CMakeLists.txt gives it.
      - name: Test
        env:
          # The core's test policy (core/testing/gpu_test.hpp). lavapipe is
          # required above, so a GPU test fails rather than skips without a
          # device, and fails on any error the layer reports, missing barriers
          # included.
          VKC_REQUIRE_VULKAN_DEVICE: '1'
          VKC_TEST_VALIDATION: '1'
          VKC_TEST_SYNC_VALIDATION: '1'
        run: |
          ctest --test-dir build --output-on-failure --no-tests=error \
            --parallel "${CTEST_PARALLEL_LEVEL:-$(getconf _NPROCESSORS_ONLN)}"
