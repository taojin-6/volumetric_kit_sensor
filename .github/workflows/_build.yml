name: build (reusable)

# Reusable build & test for one OS leg. ci.yml calls this once per entry in its
# build matrix. Every leg runs on a self-hosted runner: the Ubuntu legs in an
# OS-matched container with the GPU passed through (pass `container`), the
# macOS leg directly on the Mac. The dependency-install steps key off
# `runner.os` (Linux/macOS).
on:
  workflow_call:
    inputs:
      os:
        description: Leg identity, used in the job name and cache key (e.g. ubuntu-24.04).
        required: true
        type: string
      runner:
        description: >-
          The self-hosted runner label this leg runs on (vk-linux-gpu, mac).
        required: true
        type: string
      container:
        description: >-
          JSON for the job container, e.g.
          '{"image":"ubuntu:24.04","options":"--gpus all"}', or '' for none.
        required: false
        type: string
        default: ''
      orbbec_sdk:
        description: >-
          Install the pinned Orbbec SDK and build with VS_WITH_ORBBEC=ON, so
          this leg compiles cmake/vs_orbbec.cmake and runs the SDK smoke test.
          Needs ffmpeg off macOS.
        required: false
        type: boolean
        default: false
      realsense_sdk:
        description: >-
          Install the pinned librealsense (Ubuntu: RealSense's apt
          repository; macOS: the runner's Homebrew formula, checked) and build
          with VS_WITH_REALSENSE=ON, so this leg compiles the RealSense driver
          and runs its tests.
        required: false
        type: boolean
        default: false
      ffmpeg:
        description: >-
          Install FFmpeg and build with VS_WITH_FFMPEG=ON, so this leg builds
          the video decoders and runs their tests. Linux only, with cuda:
          macOS builds them always, with no FFmpeg.
        required: false
        type: boolean
        default: false
      cuda:
        description: >-
          Install the CUDA 13 toolkit's headers and nvcc from NVIDIA's
          repository and build with VS_WITH_CUDA=ON, so this leg hands NVDEC's
          and nvJPEG's pictures out on the device and tests them. Needs
          ffmpeg.
        required: false
        type: boolean
        default: false
      ffs:
        description: >-
          Install TensorRT from NVIDIA's CUDA repository and build with
          VS_WITH_FFS=ON, so this leg builds sensor_ffs (Fast-FoundationStereo
          on TensorRT) and runs its tests. Needs cuda.
        required: false
        type: boolean
        default: false
      hevc_backend:
        description: >-
          The hardware this leg promises the decoders run on (cuda,
          videotoolbox), passed to the tests as VS_TEST_HEVC_BACKEND; the
          decoder tests then fail, rather than skip, where no device path
          opens. Empty requires none.
        required: false
        type: string
        default: ''
      build_types:
        description: >-
          JSON array of the CMAKE_BUILD_TYPEs this leg builds and tests, one
          job each, e.g. '["Release"]'.
        required: false
        type: string
        default: '["Debug","Release"]'
      sync_validation:
        description: >-
          Run the tests under the validation layer's synchronization
          validation too (VKC_TEST_SYNC_VALIDATION).
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: [self-hosted, '${{ inputs.runner }}']
    # Render the container JSON to a map only when one was requested; the
    # macOS leg passes '' and runs directly on the runner. `&&` short-circuits,
    # so fromJSON is never handed the empty string.
    container: ${{ inputs.container != '' && fromJSON(inputs.container) || null }}
    timeout-minutes: 30
    defaults:
      run:
        # Inside a container GitHub runs `run:` steps under `sh` (dash), not
        # `bash`; force bash everywhere for one consistent shell across legs.
        shell: bash
    env:
      # 'true' when this leg runs in a container (the self-hosted GPU boxes'
      # Ubuntu legs, where the image is a bare ubuntu:* with the GPU passed
      # through); drives the toolchain install and the GPU check below.
      IN_CONTAINER: ${{ inputs.container != '' }}
    strategy:
      fail-fast: false
      # One job per build type the caller asks for: ci.yml runs an optimized
      # Release/NDEBUG build on every OS, and an unoptimized Debug one on one OS,
      # so an NDEBUG-only or optimizer-exposed break is still caught.
      matrix:
        build_type: ${{ fromJSON(inputs.build_types) }}
    steps:
      # Bare ubuntu:* images lack git (actions/checkout and FetchContent need
      # it) and sudo (the install steps use it); we run as root in the
      # container, so install them before anything else. The NVIDIA driver's
      # shader cache directory, which the container env names (ci.yml says
      # why), is made here: the driver creates nothing above its own GLCache.
      - name: Bootstrap container
        if: inputs.container != ''
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git sudo
          if [ -n "${__GL_SHADER_DISK_CACHE_PATH:-}" ]; then
            mkdir -p "${__GL_SHADER_DISK_CACHE_PATH}"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # libglm-dev supplies the GLM headers + CMake config that the
          # package's vector types alias. vulkan-tools provides vulkaninfo;
          # glslang-tools/spirv-tools cover the compute-shader toolchain.
          pkgs="cmake libglm-dev libvulkan-dev vulkan-validationlayers spirv-tools glslang-tools vulkan-tools"
          if [ "$IN_CONTAINER" = "true" ]; then
            # A bare container lacks a C/C++ toolchain and make, and the two
            # client libraries the NVIDIA Vulkan ICD needs before it will hand
            # the loader a vkCreateInstance: libGLX_nvidia.so.0 links
            # libXext.so.6 and dlopens libEGL.so.1 while initialising. Without
            # them the ICD the toolkit mounts is found and then discarded
            # ("Found no drivers!"), and every GPU test would fail.
            pkgs="$pkgs build-essential libxext6 libegl1"
          fi
          # curl fetches the Orbbec SDK, the CUDA keyring and RealSense's
          # signing key below; a bare container image lacks it, and gnupg,
          # which dearmors that key.
          if [ "${{ inputs.orbbec_sdk }}" = "true" ] || [ "${{ inputs.cuda }}" = "true" ] ||
             [ "${{ inputs.realsense_sdk }}" = "true" ]; then
            pkgs="$pkgs curl ca-certificates"
          fi
          if [ "${{ inputs.realsense_sdk }}" = "true" ]; then
            pkgs="$pkgs gnupg"
          fi
          # FFmpeg, found through pkg-config (cmake/vs_ffmpeg.cmake). NVDEC
          # needs nothing more: the toolkit mounts libcuda and libnvcuvid, which
          # FFmpeg loads at run time.
          if [ "${{ inputs.ffmpeg }}" = "true" ]; then
            pkgs="$pkgs pkg-config libavcodec-dev libavutil-dev"
          fi
          # shellcheck disable=SC2086  # intentional: split $pkgs into separate args
          sudo apt-get install -y --no-install-recommends $pkgs
          # The CUDA toolkit for VS_WITH_CUDA (cmake/vs_cuda.cmake): cuda.h,
          # nvjpeg.h and the nvcc FindCUDAToolkit locates it by; the package
          # compiles no CUDA code. libcuda comes from the container toolkit
          # at run time, as for NVDEC, and libnvjpeg from this package.
          # NVIDIA's repository key comes as a .deb that dpkg installs as
          # root, so only the file pinned here is installed: per repository,
          # the SHA256 its signed package index lists for it. Any other
          # file, or a repository with no pin, fails the leg.
          if [ "${{ inputs.cuda }}" = "true" ]; then
            . /etc/os-release
            repo="ubuntu$(echo "$VERSION_ID" | tr -d .)"
            case "$repo" in
              ubuntu2404) keyring_sha256=d2a6b11c096396d868758b86dab1823b25e14d70333f1dfa74da5ddaf6a06dba ;;
              ubuntu2604) keyring_sha256=f7f474b5f6a4adf987aa587920df00e713285958ef6a913dda1945a544a3099e ;;
              *)
                echo "::error::no pinned SHA256 for ${repo}'s cuda-keyring_1.1-1_all.deb"
                exit 1
                ;;
            esac
            curl -fsSL -o /tmp/cuda-keyring.deb \
              "https://developer.download.nvidia.com/compute/cuda/repos/${repo}/x86_64/cuda-keyring_1.1-1_all.deb"
            if ! echo "${keyring_sha256}  /tmp/cuda-keyring.deb" | sha256sum -c -; then
              echo "::error::${repo}'s cuda-keyring_1.1-1_all.deb does not match its pinned SHA256"
              exit 1
            fi
            sudo dpkg -i /tmp/cuda-keyring.deb
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends cuda-nvcc-13-4 \
              cuda-cudart-dev-13-4 cuda-driver-dev-13-4 libnvjpeg-dev-13-4
            echo "CUDAToolkit_ROOT=/usr/local/cuda-13.4" >> "$GITHUB_ENV"
            # TensorRT for VS_WITH_FFS (cmake/vs_ffs.cmake), from the same
            # repository, at the version built for this CUDA, every package
            # of it pinned so apt takes no newer one. nvcc above compiles
            # sensor_ffs's kernels; the package installs 2.6 GB.
            if [ "${{ inputs.ffs }}" = "true" ]; then
              trt=11.4.0.106-1+cuda13.4
              sudo apt-get install -y --no-install-recommends \
                "libnvinfer11=${trt}" "libnvinfer-headers-dev=${trt}" \
                "libnvinfer-safe-headers-dev=${trt}" "libnvinfer-dev=${trt}" \
                "libnvonnxparsers11=${trt}" "libnvonnxparsers-dev=${trt}"
            fi
          fi
          # The loader is pinned to nothing: the NVIDIA Vulkan ICD injected by
          # the container toolkit is then the only ICD, so the Vulkan tests run
          # on the real GPU — and if it is absent, the GPU diagnostic below
          # fails the leg.

      # The leg's Homebrew formulae, named once for the key below: glm
      # supplies the GLM math headers the package's vector types alias;
      # molten-vk is the Vulkan driver; shaderc provides glslc for the compute
      # shaders and spirv-tools the spirv-val that checks them;
      # vulkan-loader/-headers/-tools/-validationlayers complete the SDK. A job
      # on the self-hosted Mac installs nothing: it fails, naming any formula
      # missing, for the owner to install while CI is idle.
      - name: Check dependencies (macOS)
        id: formulae
        if: runner.os == 'macOS'
        run: |
          pkgs="cmake glm molten-vk vulkan-headers vulkan-loader vulkan-tools"
          pkgs="$pkgs vulkan-validationlayers shaderc spirv-tools"
          # librealsense for VS_WITH_REALSENSE (cmake/vs_realsense.cmake).
          if [ "${{ inputs.realsense_sdk }}" = "true" ]; then
            pkgs="$pkgs librealsense"
          fi
          echo "formulae=$pkgs" >> "$GITHUB_OUTPUT"
          # Without brew every formula would look missing.
          command -v brew >/dev/null || {
            echo "::error::brew is not on this runner's PATH"
            exit 1
          }
          missing=""
          for pkg in $pkgs; do
            brew list --formula "$pkg" >/dev/null 2>&1 || missing="$missing $pkg"
          done
          if [ -n "$missing" ]; then
            echo "::error::install by hand on this self-hosted runner's host, while CI is idle:${missing}"
            exit 1
          fi
          # make ships with the Xcode command-line tools.
          # The validation layer's manifest names its library without a path;
          # the Test step alone searches Homebrew's lib for it, as job-wide
          # its libraries would shadow those of every other tool.
          echo "VS_LAYER_LIBRARY_PATH=$(brew --prefix)/lib" >> "$GITHUB_ENV"
          echo "VK_LAYER_PATH=$(brew --prefix)/share/vulkan/explicit_layer.d" >> "$GITHUB_ENV"

      # The installed versions of those formulae and of all they depend on:
      # the dependency cache below keys on them, so the first run after a
      # brew upgrade builds on the new versions (the core's
      # tools/runners/README.md, "Upgrading Homebrew"). The action is at the
      # core pin in third_party/CMakeLists.txt.
      - name: Homebrew key
        id: brew
        if: runner.os == 'macOS'
        uses: taojin-6/volumetric_kit_core/.github/actions/homebrew-key@a4a6fff4af65b26b25df27c8ed8c9eecbfbfcd87
        with:
          formulae: ${{ steps.formulae.outputs.formulae }}

      # The Orbbec SDK, on the legs that build VS_WITH_ORBBEC: the pinned
      # release, installed as a developer does (see the action).
      - name: Install the Orbbec SDK
        if: inputs.orbbec_sdk
        uses: ./.github/actions/install-orbbec-sdk

      # librealsense, on the Ubuntu legs that build VS_WITH_REALSENSE: the
      # pinned release from RealSense's apt repository (see the action).
      - name: Install librealsense
        if: inputs.realsense_sdk && runner.os == 'Linux'
        uses: ./.github/actions/install-librealsense

      # Report the Vulkan device the runner sees (the real GPU in a container,
      # MoltenVK on macOS). On macOS a missing device is a notice, and the Test
      # step's VKC_REQUIRE_VULKAN_DEVICE fails the GPU tests. In a container it
      # fails the leg here: that leg exists only for the GPU behind `--gpus
      # all`.
      - name: GPU diagnostic
        run: |
          if vulkaninfo --summary; then
            exit 0
          fi
          if [ "$IN_CONTAINER" = "true" ]; then
            echo "::error::no Vulkan device visible inside the GPU container — refusing to pass a leg that would skip every GPU test"
            exit 1
          fi
          echo "::notice::no Vulkan device visible"

      # The dependency cache is keyed by the workspace *path*, so compute a short
      # fingerprint of it. See the cache step below for why the path is the thing
      # that has to match.
      - name: Workspace fingerprint
        id: ws
        run: |
          h=$(printf '%s' "${GITHUB_WORKSPACE}" |
              { sha256sum 2>/dev/null || shasum -a 256; } | cut -c1-12)
          echo "hash=${h}" >> "${GITHUB_OUTPUT}"
          echo "workspace ${GITHUB_WORKSPACE} -> ${h}"

      # Cache the FetchContent dependency tree (the core, nlohmann/json and stb
      # sources + builds) so they are not re-cloned and recompiled every run.
      # FetchContent bakes the absolute build path into its sub-build
      # CMakeCache, so a cache is only reusable where that path is identical --
      # restore one built elsewhere and Configure dies with "CMakeCache.txt
      # directory ... is different than the directory ... where CMakeCache.txt
      # was created". The key therefore carries a hash of GITHUB_WORKSPACE:
      # relocating a self-hosted runner on disk is then a natural cache miss,
      # and the containerised legs, which all see the same /__w/… path, share
      # one key.
      #
      # The key also hashes the dep-pin home (third_party/CMakeLists.txt) and
      # the root list, so a FetchContent version bump busts the cache. And it
      # carries the Homebrew key (`none` off macOS), in the restore prefix too,
      # so no tree built on other Homebrew versions is restored.
      - name: Cache third-party deps
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/_deps
          key: deps-${{ inputs.os }}-${{ matrix.build_type }}-brew${{ steps.brew.outputs.key || 'none' }}-ws${{ steps.ws.outputs.hash }}-${{ hashFiles('third_party/CMakeLists.txt', 'CMakeLists.txt') }}
          restore-keys: |
            deps-${{ inputs.os }}-${{ matrix.build_type }}-brew${{ steps.brew.outputs.key || 'none' }}-ws${{ steps.ws.outputs.hash }}-

      # A self-hosted runner keeps its _work tree between jobs, so a build/ left
      # by a previous checkout survives a runner relocation with the old absolute
      # paths still baked into every CMakeCache.txt. The key above stops the
      # *cache* carrying stale paths in, but cannot clean what is already on
      # disk, and the Configure retry cannot help: the failure is deterministic.
      # So: if any CMakeCache.txt under build/ records a directory other than
      # the one it now occupies, drop the tree and let Configure start clean.
      - name: Discard a build tree left behind at a different path
        run: |
          [ -d build ] || exit 0
          stale=$(find build -name CMakeCache.txt -exec sh -c '
            recorded=$(sed -n "s/^CMAKE_CACHEFILE_DIR:INTERNAL=//p" "$1" | head -1)
            actual=$(cd "$(dirname "$1")" && pwd)
            if [ -n "${recorded}" ] && [ "${recorded}" != "${actual}" ]; then
              echo "$1 records ${recorded}, now at ${actual}"
            fi
          ' _ {} \; | head -3)
          if [ -n "${stale}" ]; then
            echo "::warning::discarding a stale build tree:"
            echo "${stale}"
            rm -rf build
          fi

      # Default ("Unix Makefiles") generator + a parallel make build, per project
      # preference — no Ninja. The compile commands are the iOS check's flags.
      - name: Configure
        # Retry to ride out transient FetchContent git-clone DNS blips.
        run: |
          ok=0
          for attempt in 1 2 3; do
            if cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
                -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
                -DVS_WITH_ORBBEC=${{ inputs.orbbec_sdk && 'ON' || 'OFF' }} \
                -DVS_WITH_REALSENSE=${{ inputs.realsense_sdk && 'ON' || 'OFF' }} \
                -DVS_WITH_FFMPEG=${{ inputs.ffmpeg && 'ON' || 'OFF' }} \
                -DVS_WITH_CUDA=${{ inputs.cuda && 'ON' || 'OFF' }} \
                -DVS_WITH_FFS=${{ inputs.ffs && 'ON' || 'OFF' }}; then
              ok=1
              break
            fi
            echo "::warning::cmake configure attempt ${attempt} failed; retrying in 15s"
            sleep 15
          done
          [ "${ok}" = 1 ] || {
            echo "::error::cmake configure failed after 3 attempts"
            exit 1
          }

      # Runs CMAKE_BUILD_PARALLEL_LEVEL jobs at once, from the runner's .env or
      # the container env as for the Test step below, or one per core where
      # neither sets it. The level is explicit because a bare --parallel
      # ignores the variable and runs an unlimited make -j.
      - name: Build
        run: |
          cmake --build build \
            --parallel "${CMAKE_BUILD_PARALLEL_LEVEL:-$(getconf _NPROCESSORS_ONLN)}"

      # Runs CTEST_PARALLEL_LEVEL tests at once: from the runner's .env on the
      # Mac, from the container env ci.yml sets on the Ubuntu legs.
      - name: Test
        env:
          VS_TEST_HEVC_BACKEND: ${{ inputs.hevc_backend }}
          # The core's test policy (core/testing/gpu_test.hpp). Every leg has a
          # device and the validation layer, so a GPU test fails rather than
          # skips without either, and fails on any error the layer reports.
          VKC_REQUIRE_VULKAN_DEVICE: '1'
          VKC_TEST_VALIDATION: '1'
          VKC_TEST_SYNC_VALIDATION: ${{ inputs.sync_validation && '1' || '' }}
          DYLD_LIBRARY_PATH: ${{ env.VS_LAYER_LIBRARY_PATH }}
        run: ctest --test-dir build --output-on-failure --no-tests=error

      # The tests whose code runs threads again under ThreadSanitizer: the
      # Orbbec decode workers, which the sanitizer job, on address and
      # undefined only and with no Orbbec SDK, never runs. In a tree of their
      # own that reuses the sources FetchContent fetched for build/, built for
      # those tests alone (sensor_tsan_tests, tests/CMakeLists.txt), with the
      # Orbbec SDK as this leg has it. Debug only: the races do not depend on
      # the build type.
      - name: Threaded tests under ThreadSanitizer (macOS)
        if: runner.os == 'macOS' && matrix.build_type == 'Debug'
        env:
          TSAN_OPTIONS: halt_on_error=1
          VS_TEST_HEVC_BACKEND: ${{ inputs.hevc_backend }}
          VKC_REQUIRE_VULKAN_DEVICE: '1'
          VKC_TEST_VALIDATION: '1'
          DYLD_LIBRARY_PATH: ${{ env.VS_LAYER_LIBRARY_PATH }}
        run: |
          shopt -s nullglob
          flags=()
          for src in build/_deps/*-src; do
            dep=$(basename "${src}" -src | tr '[:lower:]' '[:upper:]')
            flags+=("-DFETCHCONTENT_SOURCE_DIR_${dep}=${PWD}/${src}")
          done
          rm -rf build-tsan
          cmake -S . -B build-tsan -DCMAKE_BUILD_TYPE=Debug \
            -DVS_SANITIZE=thread \
            -DVS_WITH_ORBBEC=${{ inputs.orbbec_sdk && 'ON' || 'OFF' }} \
            "${flags[@]}"
          cmake --build build-tsan \
            --parallel "${CMAKE_BUILD_PARALLEL_LEVEL:-$(getconf _NPROCESSORS_ONLN)}" \
            --target sensor_tsan_tests
          ctest --test-dir build-tsan --output-on-failure --no-tests=error \
            -R '^sensor_orbbec_(decode_worker|jpeg|hevc|open_sensors)$'

      # sensor_apple and sensor_video, with the H.265 syntax they read
      # (sensor_video_syntax), promise an iOS build (DECISIONS.md, 2026-10-08
      # and 2026-10-25), which the steps above do not make: compile them for
      # the iOS floor with build/'s flags and link them against the iOS SDK
      # (tools/ios_build_check.sh). Release only: the promise does not depend
      # on the build type.
      - name: iOS build check (macOS)
        if: runner.os == 'macOS' && matrix.build_type == 'Release'
        run: |
          # The iOS SDK ships with full Xcode only, and xcode-select may name
          # the command line tools where Xcode is installed: fall back to an
          # Xcode.app, through DEVELOPER_DIR, which is per process.
          unset DEVELOPER_DIR
          if ! xcrun --sdk iphoneos --show-sdk-path >/dev/null 2>&1; then
            for app in /Applications/Xcode*.app; do
              dir="${app}/Contents/Developer"
              if DEVELOPER_DIR="${dir}" xcrun --sdk iphoneos --show-sdk-path \
                  >/dev/null 2>&1; then
                export DEVELOPER_DIR="${dir}"
                break
              fi
            done
          fi
          if ! sdk=$(xcrun --sdk iphoneos --show-sdk-path 2>&1); then
            echo "::error::no iOS SDK; the runner needs full Xcode: ${sdk}"
            exit 1
          fi
          echo "iOS SDK: ${sdk}"
          rm -rf build-ios-check
          tools/ios_build_check.sh build/compile_commands.json build-ios-check
