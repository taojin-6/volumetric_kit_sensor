name: ci

# Umbrella CI. Every platform build/test plus camera-only, lint and sanitizers
# fan out from here, and the single `required` gate at the bottom succeeds only
# if all of them did. Branch protection requires just that one check ("ci /
# required"), so the protected `main` required-checks list stays stable as
# matrix legs (build types, OSes) are added or renamed — adding an OS never
# silently leaves an old required context unreported and blocking every PR.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Only the owner triggers this repository's workflows, so no job carries a fork
# guard.
jobs:
  build:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # The Ubuntu legs run on the self-hosted GPU boxes (label `vk-linux-gpu`),
      # each in an OS-matched container with the GPU passed through (`--gpus
      # all`), so one host covers 24.04 / 26.04 against the real driver.
      # macOS runs natively on a self-hosted Mac (label `mac`) — macOS can't be
      # containerised. _build.yml keys its install steps off `runner.os`, so
      # only the Ubuntu legs use a container; NVIDIA_DRIVER_CAPABILITIES=all
      # makes the toolkit mount the Vulkan ICD for those (and libcuda and
      # libnvcuvid for the decoders). See the core's tools/runners/README.md.
      #
      # The build and test fan-out is set in the container env, too: a runner's
      # .env reaches jobs run directly on it (the Mac) but not a job container,
      # where ctest would otherwise run the suite one test at a time. 4 is a
      # 24-core host over the package's 6 runners.
      # Each image is pinned by digest, the tag it was read from in a comment,
      # so a new image comes only with a commit that moves the pin.
      # TODO: recon's, grid's and gfx's runners share each host, so 2 would
      # match the split the core's setup-runners.sh writes for jobs on the host.
      #
      # So is the NVIDIA driver's shader cache. By default it lives under
      # $HOME/.cache, which a bare image lacks, and the driver then caches
      # nothing, so every test process compiled every pipeline cold. /__w/_tool,
      # the runner's tool cache, outlives the job, so the cache stays warm
      # across runs (the driver keys it by driver and GPU); _build.yml's
      # bootstrap creates it.
      #
      # Release runs on every OS; Debug only on macOS, where it is cheap, and
      # sanitizers builds and tests Debug on Linux (clang + ASan/UBSan). Every
      # leg is top-level, so the tests build and first-party warnings are
      # errors (VS_BUILD_TESTS and VS_WARNINGS_AS_ERRORS default on).
      #
      # `orbbec_sdk` puts 24.04 and macOS on VS_WITH_ORBBEC=ON (the SDK
      # installed per job; see _build.yml), and leaves 26.04 on the default
      # OFF, so both configurations build on every PR.
      #
      # The video decoders hand out pictures on the device only (the
      # 2026-10-06 device-only decoder decision). The Mac builds them always,
      # on VideoToolbox with no FFmpeg; `ffmpeg` builds them on 24.04 with
      # `cuda` (VS_WITH_CUDA=ON, the toolkit installed per job: NVDEC and
      # nvJPEG; 24.04's FFmpeg 6.1 is the floor). `hevc_backend` names the
      # hardware each must decode on, so their tests fail rather than skip
      # without it. 26.04 builds without them.
      #
      # Every leg runs the tests under the Khronos validation layer, and
      # `sync_validation` adds synchronization validation on the NVIDIA legs,
      # as the sanitizer job does on lavapipe.
      matrix:
        include:
          - os: ubuntu-24.04
            runner: vk-linux-gpu
            # ubuntu:24.04
            container: '{"image":"ubuntu@sha256:fe81560990fae86dc4743202b2cb4d3df98d0bcf949173cecef15ce1127ef852","options":"--gpus all","env":{"NVIDIA_DRIVER_CAPABILITIES":"all","CMAKE_BUILD_PARALLEL_LEVEL":"4","CTEST_PARALLEL_LEVEL":"4","__GL_SHADER_DISK_CACHE_PATH":"/__w/_tool/nvidia-glcache","__GL_SHADER_DISK_CACHE_SKIP_CLEANUP":"1"}}'
            build_types: '["Release"]'
            orbbec_sdk: true
            realsense_sdk: true
            ffmpeg: true
            cuda: true
            hevc_backend: cuda
            sync_validation: true
          - os: ubuntu-26.04
            runner: vk-linux-gpu
            # ubuntu:26.04
            container: '{"image":"ubuntu@sha256:6a06111c3b0a8600feadb270aec771dc239bf407b25625f93f44ab00e11f4d3c","options":"--gpus all","env":{"NVIDIA_DRIVER_CAPABILITIES":"all","CMAKE_BUILD_PARALLEL_LEVEL":"4","CTEST_PARALLEL_LEVEL":"4","__GL_SHADER_DISK_CACHE_PATH":"/__w/_tool/nvidia-glcache","__GL_SHADER_DISK_CACHE_SKIP_CLEANUP":"1"}}'
            build_types: '["Release"]'
            realsense_sdk: true
            sync_validation: true
          - os: macos-26
            runner: mac
            container: ''
            build_types: '["Debug","Release"]'
            orbbec_sdk: true
            realsense_sdk: true
            hevc_backend: videotoolbox
    uses: ./.github/workflows/_build.yml
    with:
      os: ${{ matrix.os }}
      runner: ${{ matrix.runner }}
      container: ${{ matrix.container }}
      build_types: ${{ matrix.build_types }}
      orbbec_sdk: ${{ matrix.orbbec_sdk || false }}
      realsense_sdk: ${{ matrix.realsense_sdk || false }}
      ffmpeg: ${{ matrix.ffmpeg || false }}
      cuda: ${{ matrix.cuda || false }}
      hevc_backend: ${{ matrix.hevc_backend || '' }}
      sync_validation: ${{ matrix.sync_validation || false }}

  camera-only:
    uses: ./.github/workflows/camera_only.yml

  lint:
    uses: ./.github/workflows/lint.yml

  sanitizers:
    uses: ./.github/workflows/sanitizers.yml

  required:
    # The single status check branch protection requires. It passes only when
    # every build leg, camera-only, lint and sanitizers succeeded, and FAILS
    # (never skips) on any other outcome: a skipped required check never
    # reports its result and would block every merge forever. Runs on a hosted
    # runner so the gate can always report.
    needs: [build, camera-only, lint, sanitizers]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Assert every required job succeeded
        run: |
          echo "build=${{ needs.build.result }}" \
               "camera-only=${{ needs.camera-only.result }}" \
               "lint=${{ needs.lint.result }}" \
               "sanitizers=${{ needs.sanitizers.result }}"
          if [ "${{ needs.build.result }}" = success ] \
             && [ "${{ needs.camera-only.result }}" = success ] \
             && [ "${{ needs.lint.result }}" = success ] \
             && [ "${{ needs.sanitizers.result }}" = success ]; then
            echo "All required CI jobs passed."
          else
            echo "::error::one or more required CI jobs did not succeed (see results above)"
            exit 1
          fi
